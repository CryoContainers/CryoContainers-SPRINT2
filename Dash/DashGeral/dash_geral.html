<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Geral</title>
    <link rel="stylesheet" href="dash_geral.css">

</head>
<body>
    <div class="boxPai">

        <div class="header-dashboard"> 

            <div class="menu">
                <div class="botoesMenu">
                    <a href="#?" class="botoes">Containers</a>
                    <a href="#?" class="botoes">Dashboard</a>
                    <a href="#?" class="botoes">Suporte</a>
                </div>
            </div>

            <div class="perfil-operador">
                <p>Olá, Operador</p>
            </div>
            
        </div>

        <div class="conteudo-principal">

            <div class="area-containers">

                <button class="botao-container" id="container-1"> CONTAINER 1 </button>
                
                <button class="botao-container" id="container-2"> CONTAINER 2 </button>
            </div>

            <div class="painel-notificacoes">
                
                <div class="cabecalho-notificacoes">
                    <h2>Notificações do dia</h2>
                    <a href="#" class="link-ver-todas">Ver todas</a>
                </div>

                <div class="lista-alertas">

                    <div class="card-alerta alerta-perigo">
                        <b>Desvio de temperatura</b>
                        <p>Pico de -3 ºC detectado - 10:10</p>
                    </div>


                    <div class="card-alerta alerta-sucesso">
                        <b>Temperatura Normalizada</b>
                        <p>Retorno à faixa ideal - 11:00</p>
                    </div>
                    

                    <div class="card-alerta alerta-perigo">
                        <b>Desvio de temperatura</b>
                        <p>Pico de -13 ºC detectado - 11:30</p>
                    </div>
                </div>

            </div>

        </div>
    </div>

</body>
</html>
