<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="boxPai">
        <div class="header">
            <p>Do mar ao destino, precisão que preserva a qualidade</p>
        </div>
        <div class="menu">
            <div class="botoesMenu">
                <a href="../Site_Institucional/index.html" class="botoes ativo">Inicio</a>
                <a href="../Site_Institucional/index.html" class="botoes">Sobre nós</a>
                <a href="../Site_Institucional/index.html" class="botoes">Valores</a>
                <a href="../Site_Institucional/index.html" class="botoes">Nosso produto</a>
            </div>
        </div>
        <div class="container">
            <div class="painel-esquerdo">
                <a href="../Site_Institucional/index.html">
                    <div class="logo">
                        <img src="Slide_Resumo_Sprint2-removebg-preview.png" height="100px" width="150px" alt="Logo CRYO">
                    </div>
                </a>
                <div class="textos_painel_esquerdo">
                    <p class="p1_txt">Do mar ao destino</p>
                    <p class="p2_txt">Onde a temperatura certa nunca é um acaso</p>
                    <p class="p3_txt">Acesse o painel para acompanhar o monitoramento de temperatura de suas
                        cargas em tempo
                        real.</p>
                </div>
            </div>

            <div class="painel-direito">
                <div class="formulario">
                    <p class="bem_vindo">Bem-vindo de volta!</p>

                    <p class="campos">E-mail</p>
                    <input type="text" id="email_ipt" class="campos_input">

                    <p class="campos">Senha</p>
                    <input type="password" id="senha_ipt" class="campos_input">

                    <div id="login_efetuado"></div>
                    <div id="login_negado"></div>
                        <button class="botao_entrar" onclick="entrar()">Entrar</button>
                    <p class="ou_txt">Ou</p>
                    <a href="../Tela_Cadastro/Cadastro.html">
                        <button class="botao_conta">Criar conta</button>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

<script>

    let tentativas = 3

    function entrar() {
        let senha_user = senha_ipt.value
        let senha = "Urubu100"
        let email = email_ipt.value

        // Validação de bloqueio do usuário
        if (tentativas <= 0) {
            alert(`Acesso bloqueado!`)
            login_negado.innerHTML = `Login bloqueado!`
        }

        // Validação do campo E-MAIL vazio
        else if (email.length == 0) {
            alert(`Insira um e-mail no campo E-MAIL!`)
        }

        // Validação do formato do E-MAIL
        else if (!email.includes("@")) {
            alert(`Seu E-MAIL precisa conter "@"!`)
        }

        // Validação do campo SENHA vazio
        else if (senha_user.length == 0) {
            alert(`Insira uma senha no campo SENHA!`)
        }

        // Validação de SENHA incorreta
        else if (senha_user != senha) {
            tentativas--

            if (tentativas == 0) {
                alert(`Acesso bloqueado! Você esgotou suas tentativas.`)
                login_negado.innerHTML = `Login bloqueado!`
            }
            else {
                alert(`Senha incorreta! Restam ${tentativas} tentativas.`)
            }
        }

        // Validação de SENHA correta
        else if (senha_user == senha) {
            login_efetuado.innerHTML = `Login efetuado com sucesso!`
            tentativas = 3
            window.location.href = "../Site_Dash_Geral/dashboard_geral.html";
        }
    }

</script>
